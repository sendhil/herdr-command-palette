[package]
name = "herdr-command-palette"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A macOS Herdr command palette for commands, plugin actions, and live workspaces"
repository = "https://github.com/sendhil/herdr-command-palette"
homepage = "https://github.com/sendhil/herdr-command-palette"
rust-version = "1.88"
keywords = ["herdr", "command-palette", "terminal", "macos"]
categories = ["command-line-utilities"]
exclude = ["docs/superpowers/**", ".pi-subagents/**"]

[dependencies]
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
thiserror = "2"
unicode-segmentation = "1"

# Unix process-group termination prevents descendants retaining captured pipes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
